version: 0.2

# Production receives only the already validated artifact that was shown at
# manual approval. It never checks out a newer Git revision or builds images.
phases:
  install:
    commands:
      - set -euo pipefail
      - python3 --version
      - aws --version
  pre_build:
    commands:
      - set -euo pipefail
      - test -f validated-manifest.json
      - test -f deploy/tools/runtime/validate-release.py
      - test "$(sha256sum validated-manifest.json | cut -d' ' -f1)" = "$APPROVED_MANIFEST_SHA256"
      - python3 deploy/tools/runtime/validate-release.py validated-manifest.json
      - |
        python3 - validated-manifest.json "$EXPECTED_GALA_SLUG" <<'PY'
        import json, sys
        manifest = json.load(open(sys.argv[1], encoding="utf-8"))
        if manifest["gala_slug"] != sys.argv[2]:
            raise SystemExit("release manifest targets a different gala")
        if manifest["platform"] not in {"v1", "v2"}:
            raise SystemExit("production pipeline refuses preview platform")
        PY
  build:
    commands:
      - |
        set -euo pipefail
        # Upload the validated release manifest to the Gala-only release prefix
        # in the backup bucket. The SSM document accepts only an S3 URI under this prefix.
        release_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' validated-manifest.json)"
        release_uri="s3://${RELEASE_BUCKET}/releases/${EXPECTED_GALA_SLUG}/${release_id}.json"
        if ! aws s3api put-object --bucket "$RELEASE_BUCKET" \
          --key "releases/${EXPECTED_GALA_SLUG}/${release_id}.json" \
          --body validated-manifest.json --if-none-match '*' >/dev/null 2>/tmp/put-manifest-error; then
          if ! grep -Eq 'PreconditionFailed|412' /tmp/put-manifest-error; then
            cat /tmp/put-manifest-error >&2
            exit 1
          fi
          aws s3 cp --only-show-errors "$release_uri" /tmp/prior-manifest.json
          cmp -s validated-manifest.json /tmp/prior-manifest.json || {
            echo "immutable release ID already contains different bytes" >&2; exit 1;
          }
        fi
        printf 'Release manifest uploaded: %s\n' "$release_uri"

        command_id="$(aws ssm send-command \
          --document-name "$DEPLOYMENT_DOCUMENT_NAME" \
          --instance-ids "$TARGET_INSTANCE_ID" \
          --parameters "ReleaseManifestUri=$release_uri" \
          --query 'Command.CommandId' \
          --output text)"
        test -n "$command_id"
        printf 'SSM deployment command submitted: %s\n' "$command_id"
        # A first boot initializes multiple databases and may take longer than
        # six minutes. Keep the CodeBuild gate open for up to twenty minutes;
        # the project itself has a thirty-minute timeout.
        for attempt in $(seq 1 240); do
          status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$TARGET_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
          case "$status" in
            Success) exit 0 ;;
            Pending|InProgress|Delayed|"") sleep 5 ;;
            *) printf 'SSM deployment failed with status: %s\n' "$status" >&2; exit 1 ;;
          esac
        done
        printf 'SSM deployment timed out waiting for completion\n' >&2
        exit 1
