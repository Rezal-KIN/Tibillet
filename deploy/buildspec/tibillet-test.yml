version: 0.2

# The source connection must target the Rezal fork of TiBillet/Lespass, never
# the production Gala EC2 checkout. CodeBuild receives a fixed source revision.
# Output is a candidate image digest only; a complete immutable release manifest
# (pinning all four service images) must be assembled and reviewed before promotion.
phases:
  install:
    commands:
      - set -euo pipefail
      - docker --version
      - aws --version
      - python3 --version
  pre_build:
    commands:
      - set -euo pipefail
      - test -f dockerfile
      - test -n "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
      - git rev-parse --verify "${CODEBUILD_RESOLVED_SOURCE_VERSION}^{commit}"
      - python3 -m compileall -q TiBillet BaseBillet ApiBillet Administration AuthBillet
  build:
    commands:
      - |
        set -euo pipefail
        commit="$(git rev-parse HEAD)"
        tag="sha-${commit}"
        registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        image_uri="${registry}/${LESPASS_ECR_REPOSITORY}:${tag}"
        password_file="$(mktemp)"
        cleanup() { rm -f "$password_file"; }
        trap cleanup EXIT

        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" > "$password_file"
        docker login --username AWS --password-stdin "$registry" < "$password_file"

        # Tags are immutable in ECR. Re-running the same commit reuses the
        # recorded digest instead of creating a different release.
        digest="$(aws ecr describe-images --repository-name "$LESPASS_ECR_REPOSITORY" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
        if [ -z "$digest" ] || [ "$digest" = "None" ]; then
          docker build --pull=false --tag "$image_uri" --file dockerfile .
          docker push "$image_uri"
          digest="$(aws ecr describe-images --repository-name "$LESPASS_ECR_REPOSITORY" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
        fi
        test -n "$digest"
        test "$digest" != "None"
        printf '{"application_repository":"Rezal-KIN/Tibillet","fork_commit":"%s","lespass_image":"%s@%s","platform":"%s"}\n' \
          "$commit" "$registry/$LESPASS_ECR_REPOSITORY" "$digest" "$RELEASE_PLATFORM" > release-candidate.json
artifacts:
  files:
    - release-candidate.json
