version: 0.2

# Runs after the approved Terraform apply. A failure here can be retried
# without replaying a binary Terraform plan that has already changed state.
phases:
  install:
    commands:
      - set -euo pipefail
      - python3 --version
      - aws --version
  pre_build:
    commands:
      - set -euo pipefail
      - test -n "${CODEBUILD_SRC_DIR_PlanOutput:-}"
      - export FOUNDATION_CATALOG_PROPOSAL="$CODEBUILD_SRC_DIR_PlanOutput/foundation-gala-catalog-proposal.json"
      - test -f "$FOUNDATION_CATALOG_PROPOSAL"
  build:
    commands:
      - set -euo pipefail
      - python3 deploy/tools/initialize-gala-credentials.py "$FOUNDATION_CATALOG_PROPOSAL" --project-name "$GALA_PROJECT_NAME"
      - |
        set -euo pipefail
        slug="$(python3 -c 'import importlib.util,os; s=importlib.util.spec_from_file_location("v", "deploy/tools/validate-foundation-inputs.py"); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print(m.gala_slug(os.environ["GALA_NAME"]))')"
        python3 deploy/tools/verify-gala-bootstrap.py "$FOUNDATION_CATALOG_PROPOSAL" --slug "$slug" --project-name "$GALA_PROJECT_NAME"
      - aws s3 cp --only-show-errors "$FOUNDATION_CATALOG_PROPOSAL" "$FOUNDATION_CATALOG_URI"
