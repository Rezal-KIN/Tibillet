server {
    listen 80;
    server_name cashless.galas-am-aix.rezal.fr;

    access_log /DjangoFiles/logs/nginxAccess.log;
    error_log /DjangoFiles/logs/nginxError.log;

    # Keep the common administration URL alongside Laboutik's native routes.
    location = /admin {
        return 302 /adminstaff/;
    }
    location /admin/ {
        rewrite ^/admin/(.*)$ /adminstaff/$1 last;
    }

    # Static and media géré par Nginx :
     location /static {
         root /DjangoFiles/www;
     }

     location /media {
         root /DjangoFiles/www;
     }


    # Configuration spécifique pour les WebSockets
location ~ ^/(wss|ws)/ {
        proxy_pass http://laboutik_django:8001; # 8001 fait tourner Daphne
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
    }

    # AM-Rezal modification, 2026-10-03: free source access for this release.
    location = /source {
        return 302 /source/;
    }
    location ^~ /source/ {
        alias /source/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Link '</source/>; rel="describedby"' always;
        # everything is passed to Gunicorn/Django
        proxy_pass http://laboutik_django:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
