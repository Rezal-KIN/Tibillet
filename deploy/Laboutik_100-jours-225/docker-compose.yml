services:
  laboutik_postgres:
    image: postgres:11.5-alpine
    restart: always
    env_file: .env
    volumes:
      - ./database/data:/var/lib/postgresql/data
    networks:
      - laboutik_backend

  laboutik_memcached:
    image: memcached:1.6
    restart: always
    networks:
      - laboutik_backend

  laboutik_redis:
    image: redis:6-alpine
    restart: always
    env_file: .env
    networks:
      - laboutik_backend

  laboutik_django:
    image: tibillet/laboutik:${LABOUTIK_VERSION:-latest}
    restart: always
    env_file: .env
    volumes:
      - ./www:/DjangoFiles/www
      - ./logs:/DjangoFiles/logs
      - ./backup:/Backup
      - ./ssh:/home/tibillet/.ssh # if you want to use borgbackup with ssh
      - ./settings.py:/DjangoFiles/Cashless/settings.py
      - ./views.py:/DjangoFiles/webview/views.py
      - ./fedow_api.py:/DjangoFiles/fedow_connect/fedow_api.py
      - ./validators.py:/DjangoFiles/webview/validators.py
      - ./views.py:/DjangoFiles/webview/views.py
      - ./fedow_api.py:/DjangoFiles/fedow_connect/fedow_api.py
      - ./validators.py:/DjangoFiles/webview/validators.py
    links:
      - laboutik_postgres:postgres
      - laboutik_redis:redis
      - laboutik_memcached:memcached
    depends_on:
      - laboutik_postgres
      - laboutik_redis
      - laboutik_memcached
    networks:
      - laboutik_backend
    # only useful for dev purpose :
    # extra_hosts:
    #   - "fedow.tibillet.localhost:172.17.0.1"
    #   - "lespass.tibillet.localhost:172.17.0.1"
    #   - "cashless.tibillet.localhost:172.17.0.1"


  laboutik_nginx:
    image: nginx
    restart: always
    depends_on:
      - laboutik_django
    links:
      - laboutik_django:laboutik_django
    volumes:
      - ./www:/DjangoFiles/www
      - ./logs:/DjangoFiles/logs
      - ./nginx:/etc/nginx/conf.d
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.laboutik_100-jours-225.tls.certresolver=myresolver
      - traefik.http.routers.laboutik_100-jours-225.rule=Host(`${DOMAIN}`)
    networks:
      - frontend
      - laboutik_backend

networks:
  frontend:
    external: true
  laboutik_backend:
