server {
    listen 80;
    server_name localhost;

    access_log /logs/nginxAccess.log;
    error_log /logs/nginxError.log;

    location /static {
        root /www;
    }

    location /media {
        root /www;
    }

    # AM-Rezal modification, 2026-10-03: free source access for this release.
    location = /source {
        return 302 /source/;
    }
    location ^~ /source/ {
        alias /source/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Link '</source/>; rel="describedby"' always;
        # everything is passed to Gunicorn
        proxy_pass http://fedow_django:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
