upstream fedow_django {
    server fedow_django:8000;
}
server {
    listen 80;
    server_name fedow.galas-am-aix.rezal.fr;
    # Rezal-KIN modification, 2026-10-03: free source access for this release.
    location = /source {
        return 302 /source/;
    }
    location ^~ /source/ {
        alias /source/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        add_header Link '</source/>; rel="describedby"' always;
        proxy_pass http://fedow_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /static/ {
        alias /www/static/;
    }
}
