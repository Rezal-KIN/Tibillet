upstream fedow_django {
    server fedow_django:8000;
}
server {
    listen 80;
    server_name fedow.galas-am-aix.rezal.fr;
    location / {
        proxy_pass http://fedow_django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /static/ {
        alias /www/static/;
    }
}
