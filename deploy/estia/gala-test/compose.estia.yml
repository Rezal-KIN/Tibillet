# VM gala-test uniquement. Charger explicitement APRES docker-compose.yml.
# Les secrets restent dans ~/gala-test-config/, jamais dans le checkout.
services:
  traefik:
    # Compose remplace command, il ne concatene pas cette liste.
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.network=frontend
      - --providers.docker.exposedbydefault=false
      # Seuls nos deux nginx sont publies ; Mailpit reste intact et interne.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`tibillet`) && (Label(`com.docker.compose.service`,`lespass_nginx`) || Label(`com.docker.compose.service`,`fedow_nginx`))
      - --entrypoints.entrypoints-http.address=:80
      - --entrypoints.entrypoints-http.forwardedHeaders.trustedIPs=192.168.1.10/32
    # Compose >= 2.24.4 ; remplace les publications 80/443 du fichier de dev.
    ports: !override
      - 192.168.1.195:80:80
    configs: !reset []
  lespass_django:
    command: [bash, deploy/estia/gala-test/start-web.sh]
    secrets:
      - brevo_smtp_key
    environment:
      EMAIL_DELIVERY_GUARD: "1"
      EMAIL_DELIVERY_MODE: ${GALA_EMAIL_DELIVERY_MODE:-live}
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/brevo_smtp_key
    extra_hosts:
      - gala-test.rezal.fr:192.168.1.10
      - cashless.gala-test.rezal.fr:192.168.1.10
      - fedow.gala-test.rezal.fr:192.168.1.10
  lespass_celery:
    secrets:
      - brevo_smtp_key
    environment:
      EMAIL_DELIVERY_GUARD: "1"
      EMAIL_DELIVERY_MODE: ${GALA_EMAIL_DELIVERY_MODE:-live}
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/brevo_smtp_key
    extra_hosts:
      - gala-test.rezal.fr:192.168.1.10
      - cashless.gala-test.rezal.fr:192.168.1.10
      - fedow.gala-test.rezal.fr:192.168.1.10
  fedow_django:
    # Native Fedow unnecessarily requires Stripe with DEBUG=0. This local
    # derivative permits CAWL without any Stripe key, preserving all other code.
    image: gala-test-fedow:cawl
    build:
      context: ./deploy/estia/gala-test
      dockerfile: fedow-cawl.Dockerfile
    volumes:
      - gala_fedow_static:/home/fedow/Fedow/www/static
    extra_hosts:
      - gala-test.rezal.fr:192.168.1.10
      - cashless.gala-test.rezal.fr:192.168.1.10
      - fedow.gala-test.rezal.fr:192.168.1.10
  lespass_nginx:
    volumes:
      - ./nginx_prod/lespass_prod.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      traefik.http.routers.lespass_nginx.tls: "false"
      traefik.http.routers.lespass_nginx.entrypoints: entrypoints-http
      traefik.http.routers.lespass_nginx.rule: Host(`gala-test.rezal.fr`) || Host(`cashless.gala-test.rezal.fr`)
      traefik.http.routers.lespass_nginx.middlewares: estia-seulement
      # RemoteAddr (pas la chaine X-Forwarded-For fournie par le visiteur).
      traefik.http.middlewares.estia-seulement.ipallowlist.sourcerange: 192.168.1.10/32
  fedow_nginx:
    volumes:
      - gala_fedow_static:/www/static:ro
    labels:
      traefik.http.routers.fedow_nginx.tls: "false"
      traefik.http.routers.fedow_nginx.entrypoints: entrypoints-http
      traefik.http.routers.fedow_nginx.rule: Host(`fedow.gala-test.rezal.fr`)
      traefik.http.routers.fedow_nginx.middlewares: estia-seulement
  mailpit:
    labels:
      traefik.enable: "false"

secrets:
  brevo_smtp_key:
    file: /home/tibillet/gala-test-config/brevo-local/smtp-key

volumes:
  gala_fedow_static:
