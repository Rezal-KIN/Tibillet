[supervisord]
nodaemon=true
logfile=/DjangoFiles/logs/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/DjangoFiles/logs/supervisor/supervisord.pid

[include]
files=/DjangoFiles/supervisor/conf.d/gunicorn.conf /DjangoFiles/supervisor/conf.d/daphne.conf

[supervisorctl]
serverurl=unix:///DjangoFiles/logs/supervisor/supervisor.sock

[unix_http_server]
file=/DjangoFiles/logs/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
