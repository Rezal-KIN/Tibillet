# Applied on top of docker-compose.yml only during a pipeline-driven release
# deploy (see tools/runtime/deploy-release.sh and gala.conf.example
# COMPOSE_FILES). Pins lespass_django/lespass_celery to the exact ECR digest
# recorded in the release manifest, replacing the source build used for
# local/dev iteration.
#
# `build: !reset null` is required, not optional: Compose merges services by
# key, so without it docker-compose.yml's `build:` would still win over
# `image:` and a "release" deploy would silently rebuild from source instead
# of running the validated digest (see .claude/NOTES.md, "Pipeline delivery").
# !reset needs Docker Compose >= 2.24 — the gala EC2 runs v5.1.0, confirmed.
services:
  # These are the running Smoke helper digests, without a database version change.
  lespass_nginx:
    image: nginx@sha256:332d0beea97cff8c0d5d27976c0778a4b00345b9d74c2feaaf8efde548314948
  lespass_memcached:
    image: memcached@sha256:2046d6d2eb7cbd59470b533a101cbd67def3e718b04eb72478306dbc804a3171
  lespass_redis:
    image: redis@sha256:a7cee7c8178ff9b5297cb109e6240f5072cdaaafd775ce6b586c3c704b06458e
  lespass_postgres:
    image: postgres@sha256:f0cffcc050a9f1f3c78a9968e221badc1cdd02e2ae15b1de9b12bee1ba5ea2db
  lespass_django:
    image: ${LESPASS_IMAGE}
    build: !reset null
    # Every Gala uses the same public names, even while inactive. Resolve
    # inter-service HTTPS through this host's Traefik instead of the active EIP.
    extra_hosts:
      - "${FEDOW_PUBLIC_DOMAIN}:host-gateway"
      - "${LABOUTIK_PUBLIC_DOMAIN}:host-gateway"
  lespass_celery:
    image: ${LESPASS_IMAGE}
    build: !reset null
    extra_hosts:
      - "${FEDOW_PUBLIC_DOMAIN}:host-gateway"
      - "${LABOUTIK_PUBLIC_DOMAIN}:host-gateway"
