<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Gala-am-Aix</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#021244;padding:28px 24px;text-align:center;">
              <img src="https://galas-am-aix.rezal.fr/static/reunion/img/logo.webp" alt="Logo Gala" style="height:72px;width:auto;display:inline-block;" />
            </td>
          </tr>

          <tr>
            <td style="padding:34px 28px 24px 28px;text-align:center;">
              <p style="margin:0 0 24px 0;font-size:18px;line-height:1.55;color:#334155;">
                Cliquez sur le lien pour acceder a votre compte.
              </p>

              <table role="presentation" cellspacing="0" cellpadding="0" align="center" style="margin:0 auto 18px auto;">
                <tr>
                  <td style="background:#2563eb;border-radius:10px;">
                    <a href="{{ connexion_url }}" target="_blank" style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-size:18px;font-weight:700;">
                      Acceder a mon compte
                    </a>
                  </td>
                </tr>
              </table>

              <p style="margin:0;font-size:14px;line-height:1.6;color:#64748b;">
                Si vous n'etes pas a l'origine de cette demande, vous pouvez ignorer ce message.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
