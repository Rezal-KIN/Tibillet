{% load static i18n %}
<form id="loginForm" method="post">
    {% csrf_token %}
    <h4 id="loginFormTitle">{% trans "With an email" %}</h4>

    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="loginEmail" placeholder="mon@email.fr" name="email" required>
        <label for="loginEmail">{% trans "Email address" %}</label>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-6">
            <div class="form-floating">
                <input type="text" class="form-control" id="loginFirstName" placeholder="Prénom" name="first_name">
                <label for="loginFirstName">Prénom</label>
            </div>
        </div>
        <div class="col-6">
            <div class="form-floating">
                <input type="text" class="form-control" id="loginLastName" placeholder="Nom" name="last_name">
                <label for="loginLastName">Nom</label>
            </div>
        </div>
    </div>
    <p class="text-muted small mb-3">Prénom et nom utiles uniquement lors de votre première inscription.</p>

    <button id="loginSubmitBtn" type="submit" class="btn btn-primary d-block w-100">Connexion / Inscription</button>
    <p id="loginFeedback" class="mt-3 mb-0" style="display:none;font-weight:600;"></p>
</form>

<script>
    (function () {
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const firstNameInput = document.getElementById('loginFirstName');
        const lastNameInput = document.getElementById('loginLastName');
        const submitBtn = document.getElementById('loginSubmitBtn');
        const feedback = document.getElementById('loginFeedback');

        if (!form || !emailInput || !feedback) return;

        const emailRe = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return '';
        }

        function showFeedback(message, isSuccess) {
            feedback.style.display = 'block';
            feedback.textContent = message;
            feedback.style.color = isSuccess ? '#16a34a' : '#dc2626';
        }

        form.addEventListener('submit', async function (evt) {
            evt.preventDefault();

            if (!emailRe.test((emailInput.value || '').trim())) {
                showFeedback('Adresse mail invalide.', false);
                emailInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Envoi en cours…';

            const body = new URLSearchParams();
            body.set('email', emailInput.value.trim());
            body.set('prenom', (firstNameInput.value || '').trim());
            body.set('nom', (lastNameInput.value || '').trim());

            try {
                const response = await fetch('/connexion_with_names/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                        'X-CSRFToken': getCookie('csrftoken'),
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: body.toString(),
                    credentials: 'same-origin'
                });
                const payload = await response.json().catch(() => ({}));
                if (response.ok && payload.ok) {
                    showFeedback('Mail envoyé ! Vérifiez votre boîte de réception.', true);
                    submitBtn.textContent = 'Mail envoyé';
                } else {
                    showFeedback(payload.message || 'Erreur serveur.', false);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Connexion / Inscription';
                }
            } catch (error) {
                showFeedback('Erreur réseau, veuillez réessayer.', false);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Connexion / Inscription';
            }
        });
    })();

    function closePanel(id, delay) {
        const element = document.querySelector(id);
        const panel = bootstrap.Offcanvas.getInstance(element);
        window.setTimeout(() => { panel.hide(); }, delay);
    }
</script>
