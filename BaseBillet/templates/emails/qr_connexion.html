<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion {{ organisation }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="max-width:640px;width:100%;background:#fff;border-radius:14px;overflow:hidden;">
        <tr><td style="background:#021244;padding:28px 24px;text-align:center;">
          <img src="{{ image_url }}" alt="{{ organisation }}" style="height:72px;max-width:100%;width:auto;display:inline-block;">
        </td></tr>
        <tr><td style="padding:34px 28px 24px;text-align:center;">
          <h1 style="font-size:24px;line-height:1.3;margin:0 0 18px;">Votre carte {{ organisation }}</h1>
          <p style="font-size:18px;line-height:1.55;color:#334155;">Cliquez sur ce lien pour accéder directement à votre carte et la recharger.</p>
          <a href="{{ connexion_url }}" style="display:inline-block;padding:14px 24px;background:#2563eb;border-radius:10px;color:#fff;text-decoration:none;font-size:18px;font-weight:700;">Accéder à ma carte</a>
          <p style="font-size:14px;line-height:1.6;color:#64748b;">Si vous n'êtes pas à l'origine de cette demande, ignorez ce message.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
