# Déploiement et tests sur la VM gala-test (Proxmox du Rezal).
# / Deploy and test on the gala-test VM (Rezal Proxmox).
#
# Tourne sur le runner auto-hébergé « gala-test » (service sur la VM, utilisateur tibillet).
# La configuration de la VM (.env, certificat) vit hors du dépôt, dans
# ~/gala-test-config/ : elle n'est jamais commitée.
#
# Sécurité : déclenché seulement par un push sur la branche ou à la main, JAMAIS par
# une pull request : un fork ne peut pas faire exécuter de code sur la VM.

name: gala-test — déploiement et tests

on:
  push:
    branches: [tibillet-local-upstream]
  workflow_dispatch:
    inputs:
      suite:
        description: "Tests à lancer"
        type: choice
        options: [cawl, complete]
        default: cawl

permissions:
  contents: read

concurrency:
  group: gala-test
  cancel-in-progress: false

jobs:
  deployer-et-tester:
    if: github.repository == 'Rezal-KIN/Tibillet'
    runs-on: [self-hosted, gala-test]
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: tibillet
      URL_LESPASS: https://cashless.gala-test.rezal.fr/
      CURL_RESOLVE: cashless.gala-test.rezal.fr:443:192.168.1.10
      COMPOSE_FILE: docker-compose.yml:deploy/estia/gala-test/compose.estia.yml
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration de la VM (hors dépôt)
        run: |
          cp ~/gala-test-config/.env .env
          chmod 600 .env
          rm -rf certs && cp -r ~/gala-test-config/certs certs
          # Fichiers de log créés AVANT la pile : sinon nginx (root) les crée le premier
          # et le démarrage de Django (`touch`) échoue en boucle.
          # / Log files created BEFORE the stack, otherwise nginx (root) creates them first.
          mkdir -p logs
          rm -f logs/nginxAccess.log logs/nginxError.log
          touch logs/nginxAccess.log logs/nginxError.log logs/gunicorn.logs logs/Djangologfile

      - name: Construire et démarrer la pile
        run: |
          docker network inspect frontend >/dev/null 2>&1 || docker network create frontend
          # Only the application/proxy services: retain the existing databases,
          # caches and Mailpit even when the shared .env changes.
          docker compose build lespass_django lespass_celery fedow_django lespass_nginx fedow_nginx traefik
          # Migration additive AVANT de démarrer le nouveau code des services.
          # / Apply additive migrations BEFORE starting the new service code.
          docker compose run --rm --no-deps lespass_django poetry run python /DjangoFiles/manage.py migrate_schemas
          docker compose up -d --no-deps lespass_django lespass_celery fedow_django lespass_nginx fedow_nginx traefik
          # Un conteneur Django recréé change d'adresse : nginx garde l'ancienne et répond 502.
          # / A recreated Django container changes address: nginx keeps the old one (502).
          docker compose restart fedow_nginx lespass_nginx
          docker compose ps --format "{{.Name}} {{.Status}}"

      - name: Migrations
        run: |
          # Attendre que Django tourne vraiment (un conteneur peut être en attente de
          # redémarrage) et que PostgreSQL accepte les connexions.
          # / Wait until Django really runs and PostgreSQL accepts connections.
          for essai in $(seq 1 60); do
            etat=$(docker inspect -f '{{.State.Running}} {{.State.Restarting}}' lespass_django)
            [ "$etat" = "true false" ] && docker exec lespass_postgres pg_isready -q && break
            sleep 3
          done
          [ "$etat" = "true false" ] || { docker logs --tail 30 lespass_django; exit 1; }
          docker exec lespass_django poetry run python /DjangoFiles/manage.py collectstatic --no-input -v 0

      - name: Domaines publics du lieu de test
        run: |
          # Native Fedow runs migrations/collectstatic before Gunicorn. Wait
          # for readiness before docker exec, rather than racing its restart.
          code_fedow=000
          for essai in $(seq 1 60); do
            code_fedow=$(curl -sS --connect-timeout 3 --max-time 10 --resolve fedow.gala-test.rezal.fr:443:192.168.1.10 -o /dev/null -w '%{http_code}' https://fedow.gala-test.rezal.fr/ || true)
            [ "$code_fedow" = 200 ] && break
            sleep 3
          done
          [ "$code_fedow" = 200 ] || { echo "Fedow ne repond pas ; domaines inchanges."; exit 1; }
          # Conserver le premier etat, hors du checkout nettoye par Actions.
          if [ ! -e ~/gala-test-config/domaines-avant-estia.txt ]; then
            (set -o noclobber
             docker exec -i lespass_django poetry run python manage.py shell \
               < deploy/estia/gala-test/domaines.py \
               > ~/gala-test-config/domaines-avant-estia.txt)
          fi
          docker exec -i -e ESTIA_DOMAIN_MODE=apply lespass_django poetry run python manage.py shell \
            < deploy/estia/gala-test/domaines.py
          place_uuid=$(docker exec lespass_django poetry run python manage.py shell -c \
            'from django.db import connection; connection.set_schema("lespass"); from fedow_connect.models import FedowConfig; print(FedowConfig.objects.get().fedow_place_uuid)' | tail -n 1)
          docker exec -i -e ESTIA_DOMAIN_MODE=apply -e "ESTIA_PLACE_UUID=$place_uuid" \
            fedow_django poetry run python manage.py shell < deploy/estia/gala-test/fedow-domain.py

      - name: Serveurs HTTP et WebSockets
        run: |
          docker exec lespass_django supervisorctl -c deploy/estia/gala-test/supervisord-web.conf status
          for essai in $(seq 1 60); do
            [ "$(curl -sS --location --max-redirs 5 --connect-timeout 3 --max-time 10 --resolve "$CURL_RESOLVE" -o /dev/null -w '%{http_code}' "$URL_LESPASS")" = 200 ] && exit 0
            sleep 3
          done
          echo "Le serveur ne répond pas" ; exit 1

      - name: Isolation SMTP des tests
        run: docker exec -e TEST=1 -e DEBUG=1 lespass_django poetry run python -m unittest deploy.tests.test_gala_mail_delivery deploy.tests.test_gala_fedow_cawl -v

      - name: Portail cashless et accès au compte
        run: docker exec -e TEST=1 -e DEBUG=1 -e EMAIL_DELIVERY_MODE=capture lespass_django poetry run python manage.py test seo.portal.tests deploy.tests.test_cashless_portal --verbosity 1 --noinput

      - name: Tests CAWL et comptabilité
        run: |
          bash scripts/lancer_tests.sh python -q \
            tests/pytest/test_laboutik_entree.py \
            tests/pytest/test_cawl_ventes.py \
            tests/pytest/test_cawl_passerelle.py \
            tests/pytest/test_garde_aucun_amount_fois_qty.py \
            tests/pytest/test_plan_comptable_unique.py \
            tests/pytest/test_qr_parcours_securise.py \
            tests/pytest/test_carte_perdue_cycle_complet.py \
            tests/pytest/test_vues_carte_branchees_sur_service.py \
            tests/pytest/test_carte_liee_chez_fedow_fed_en_caisse.py

      - name: Suite complète (à la demande)
        if: github.event_name == 'workflow_dispatch' && inputs.suite == 'complete'
        # Les tests Stripe échouent sans clé Stripe (attendu sur une instance CAWL) :
        # cette étape informe, elle ne bloque pas.
        continue-on-error: true
        run: |
          trap 'GALA_EMAIL_DELIVERY_MODE=live docker compose up -d --no-deps lespass_django lespass_celery && docker compose restart lespass_nginx' EXIT
          GALA_EMAIL_DELIVERY_MODE=capture docker compose up -d --no-deps lespass_django lespass_celery
          docker compose restart lespass_nginx
          for essai in $(seq 1 60); do
            [ "$(curl -sS --location --max-redirs 5 --connect-timeout 3 --max-time 10 --resolve "$CURL_RESOLVE" -o /dev/null -w '%{http_code}' "$URL_LESPASS")" = 200 ] && break
            sleep 3
          done
          bash scripts/lancer_tests.sh python -q -rfE tests/pytest/ booking/tests/

      - name: Restaurer les mails réels après la suite complète
        if: always() && github.event_name == 'workflow_dispatch' && inputs.suite == 'complete'
        run: |
          GALA_EMAIL_DELIVERY_MODE=live docker compose up -d --no-deps lespass_django lespass_celery
          docker compose restart lespass_nginx

      - name: État de la pile
        if: always()
        run: docker compose ps --format "{{.Name}} {{.Status}}"
